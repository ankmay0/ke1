<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Field notes & insights — M/s Karan Enterprises. Reflections on railway track works, slope protection, civil construction and the long road of delivering reliable infrastructure across India since 2013." />
    <title>Field Notes & Insights — M/s Karan Enterprises</title>
    <!-- fonts are self-hosted locally (see src/fonts.css + public/fonts) — no external dependency -->
    <!-- set the colour scheme before paint to avoid a flash; defaults to the dark reinvention -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ke_theme');
          document.documentElement.setAttribute('data-theme', t === 'light' ? 'light' : 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/blogs-main.jsx"></script>
  </body>
</html>
